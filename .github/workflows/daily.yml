name: Daily Cyber Briefing

on:
  schedule:
    # Runs automatically at 04:00 UTC (06:00 AM Budapest Time)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser google-genai

      - name: Fetch Yesterday's Briefing (Memory)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Grabs the body of the most recent issue to use as context
          gh issue list --state all --limit 1 --json body --jq '.[0].body' > yesterday.md || echo "No previous briefing found." > yesterday.md

      - name: Run Synthesis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          gh issue create --title "🛡️ Daily Cyber Briefing: $DATE" --body-file briefing.md
