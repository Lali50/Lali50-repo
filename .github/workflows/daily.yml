name: Daily Cyber Briefing

on:
  schedule:
    # Runs automatically at 04:00 UTC (06:00 AM Budapest Time)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Yesterday's Briefing (Memory)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Grabs the body of the most recent issue to use as context
          gh issue list --state all --limit 1 --json body --jq '.[0].body' > yesterday.md || echo "No previous briefing found." > yesterday.md

      - name: Run Synthesis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Allows you to dynamically change models via GitHub Secrets/Vars
          GEMINI_MODEL: "gemini-3.8-flash" 
          TEST_MODE: "false"
        run: python main.py
        

      # IMPORTANT: Commit the newly generated yesterday.md and briefing.md 
      # back to the repository so the memory persists for tomorrow's run.
      - name: Commit Memory & Briefing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add briefing.md yesterday.md
          git commit -m "Automated update: Cyber Briefing & Memory State" || echo "No changes to commit"
          git push

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          gh issue create --title "🛡️ Daily Cyber Briefing: $DATE" --body-file briefing.md
